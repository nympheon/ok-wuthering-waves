[build-system]
requires = ["setuptools>=77", "cython>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "echodesk"
version = "0.0.1"
requires-python = ">=3.14.10,<3.15"
dependencies = [
    "dulwich==1.2.21",
    "mcp==2.3.0",
    "ok-script[ocr,qt]==3.0.10",
    "ok-pyside-minimal==6.12.0.post2",
    "onnxocr-ppocrv6>=0.0.1",
    "openvino>=2026.4.1",
    "opencv-python",
    "playwright",
    "pyappify[standalone]>=1.0.20"
]

[project.optional-dependencies]
dev = [
    "polib",
    "pytest",
    "packaging>=26.3",
    "uv==0.13.9",
]
